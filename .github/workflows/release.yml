name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check_version
        run: |
          VERSION=$(grep -oE "Version:[[:space:]]*[0-9]+(\.[0-9]+)*" wcpos-vipps.php | grep -oE "[0-9]+(\.[0-9]+)*")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if git tag | grep -q "v$VERSION"; then
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        if: steps.check_version.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (production)
        if: steps.check_version.outputs.release == 'true'
        run: composer install --no-dev --no-progress

      - name: Setup Node
        if: steps.check_version.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies and build
        if: steps.check_version.outputs.release == 'true'
        run: |
          npm ci
          npm run build

      - name: Create Release
        if: steps.check_version.outputs.release == 'true'
        run: |
          gh release create "v$VERSION" --title "Release v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload ZIP
        if: steps.check_version.outputs.release == 'true'
        run: |
          # WordPress 7.1.4+ unpacks packages into a randomly suffixed folder and installs a flat zip
          # there, so the zip must hold the installed folder (catalog slug) as its only top-level entry.
          mkdir -p "$RUNNER_TEMP/stage/wcpos-vipps"
          rsync -a --exclude='.git*' ./ "$RUNNER_TEMP/stage/wcpos-vipps/"
          cd "$RUNNER_TEMP/stage"
          zip -r "$GITHUB_WORKSPACE/wcpos-vipps.zip" wcpos-vipps \
            -x "*.git*" \
            -x "wcpos-vipps/node_modules/*" \
            -x "wcpos-vipps/assets/src/*" \
            -x "wcpos-vipps/tests/*" \
            -x "wcpos-vipps/docs/*" \
            -x "wcpos-vipps/phpunit.xml.dist" \
            -x "wcpos-vipps/vite.config.ts" \
            -x "wcpos-vipps/tsconfig.json" \
            -x "wcpos-vipps/.github/*" \
            -x "wcpos-vipps/composer.json" \
            -x "wcpos-vipps/composer.lock" \
            -x "wcpos-vipps/package.json" \
            -x "wcpos-vipps/package-lock.json" \
            -x "wcpos-vipps/phpcs.xml.dist" \
            -x "wcpos-vipps/vendor/bin/*"
          cd "$GITHUB_WORKSPACE"
          TOP_LEVEL=$(unzip -Z1 wcpos-vipps.zip | cut -d/ -f1 | sort -u)
          if [ "$TOP_LEVEL" != "wcpos-vipps" ]; then
            echo "::error::wcpos-vipps.zip must contain only wcpos-vipps/ at the top level, found: $TOP_LEVEL"
            exit 1
          fi
          gh release upload "v$VERSION" wcpos-vipps.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
